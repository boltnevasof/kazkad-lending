# nginx для kazkad.digital.
#
# Лендинг — статика, поэтому отдаём его напрямую из /var/www, без контейнера
# и проксирования, как сделано у uzum-mockup. Сертификат выпущен certbot'ом
# сразу на оба имени, пути к нему ниже.
#
# Ставится так:
#   scp deploy/kazkad.digital.conf root@45.144.221.146:/etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/kazkad.digital.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# http и www уводим на один адрес постоянным редиректом. Иначе у поисковика
# два одинаковых сайта, и какой из них главный, он решает сам.
server {
    listen 80;
    listen [::]:80;
    server_name kazkad.digital www.kazkad.digital;
    return 301 https://kazkad.digital$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kazkad.digital;

    ssl_certificate /etc/letsencrypt/live/kazkad.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazkad.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kazkad.digital$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kazkad.digital;

    ssl_certificate /etc/letsencrypt/live/kazkad.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazkad.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kazkad.digital;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json text/plain;
    gzip_min_length 1024;

    # Адрес со слешем на конце дублирует страницу, уводим на вариант без него.
    rewrite ^/(.+)/$ /$1 permanent;

    # Каждая страница собрана в свой index.html (scripts/prerender.mjs), поэтому
    # сервер отдаёт готовый HTML с текстом, а не пустую оболочку приложения.
    # index.html проверяется раньше $uri: для корня $uri — каталог, и индексный
    # модуль сделал бы внутренний редирект вместо прямой отдачи файла.
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Несуществующий адрес получает честный код 404 и страницу «Такой страницы нет».
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Бандлы vite содержат хэш в имени, их можно кэшировать навсегда.
    location ~* ^/assets/index-.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Шрифты, иконки и логотипы имя не меняют, поэтому кэш короче.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
}
