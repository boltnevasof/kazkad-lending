# nginx для kazkad.digital.
#
# Лендинг — статика, поэтому отдаём его напрямую из /var/www, без контейнера
# и проксирования, как сделано у uzum-mockup. Блок 443 и редирект с 80
# дописывает certbot при выпуске сертификата.
#
# Ставится так:
#   scp deploy/kazkad.digital.conf root@45.144.221.146:/etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/kazkad.digital.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d kazkad.digital -d www.kazkad.digital

server {
    listen 80;
    listen [::]:80;
    server_name kazkad.digital www.kazkad.digital;

    root /var/www/kazkad.digital;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # Одностраничное приложение с клиентским роутером: любой неизвестный путь
    # должен вернуть index.html, иначе /cases и /privacy дадут 404 при прямом
    # заходе и обновлении страницы.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Бандлы vite содержат хэш в имени, их можно кэшировать навсегда.
    location ~* ^/assets/index-.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Шрифты, иконки и логотипы имя не меняют, поэтому кэш короче.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
}
