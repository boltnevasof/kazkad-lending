<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Блок между метками пререндер заменяет тегами своей страницы: title,
         описание, canonical, превью ссылки и разметка schema.org
         (scripts/prerender.mjs). Здесь значения по умолчанию для dev. -->
    <!--kz-head-->
    <title>Kazkad | Каскадная разработка сайтов и веб-сервисов за 3 недели</title>
    <meta
      name="description"
      content="Студия Kazkad из Казани запускает сайты, веб-платформы и Telegram-ботов за 3 недели после подписания договора. Работаем по каскадной модели, а если не успели по нашей вине, возвращаем половину суммы."
    />
    <!--/kz-head-->
    <link rel="icon" href="/assets/logo-mark.png" />

    <!-- Logo, glow and Lucide glyphs are resolved at runtime by the design system
         components; both bases point at public/assets. -->
    <script>
      window.KZ_ICON_BASE = '/assets/icons/';
      window.KZ_ASSET_BASE = '/assets/';
    </script>

    <!-- Без JavaScript проявление и заставка не запустятся, поэтому показываем всё сразу. -->
    <noscript>
      <style>
        [data-reveal], .kz-word__in, .kz-tile { opacity: 1 !important; translate: none !important; }
        .kz-word { overflow: visible !important; }
        .kz-preloader, .kz-curtain { display: none !important; }
        /* Этапами управляет прокрутка: без скриптов показываем все три карточки сразу. */
        .kz-stages--scroll { min-height: 0 !important; }
        .kz-stages__sticky { position: static !important; min-height: 0 !important; padding: 80px 0 !important; }
        .kz-stages__cards { display: grid !important; gap: 16px !important; margin-top: 28px !important; }
        .kz-stage-card { position: static !important; width: auto !important; opacity: 1 !important;
          visibility: visible !important; filter: none !important; transform: none !important; }
        .kz-stage-card__leader { display: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--kz-app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
