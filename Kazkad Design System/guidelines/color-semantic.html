<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Three only — ok, warn, risk; used in badges and form errors" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:84px;border-radius:0;display:flex;align-items:flex-end;padding:8px;font:var(--type-eyebrow);letter-spacing:.02em}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--text-faint)}.stack{display:flex;flex-direction:column;gap:10px}</style></head><body><div class="g" style="gap:12px">
<div class="sw" style="background:var(--status-ok-surface);color:var(--status-ok-text);border-radius:var(--radius-sm)"><span>ok<br>#0f9d63 on #e7f6ef</span></div>
<div class="sw" style="background:var(--status-warn-surface);color:var(--status-warn-text);border-radius:var(--radius-sm)"><span>warn<br>#c77a06 on #fdf3e2</span></div>
<div class="sw" style="background:var(--status-risk-surface);color:var(--status-risk-text);border-radius:var(--radius-sm)"><span>risk<br>#d93a34 on #fdeceb</span></div>
</div></body></html>
