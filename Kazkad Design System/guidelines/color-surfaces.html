<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:0}.sw{flex:1;height:84px;border-radius:0;display:flex;align-items:flex-end;padding:8px;font:var(--type-eyebrow);letter-spacing:.02em}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--text-faint)}.stack{display:flex;flex-direction:column;gap:10px}</style></head><body><div class="g" style="gap:12px">
<div class="sw" style="background:var(--surface-page);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"><span>surface-page</span></div>
<div class="sw" style="background:var(--surface-subtle);border-radius:var(--radius-sm)"><span>surface-subtle</span></div>
<div class="sw" style="background:var(--surface-tint);border-radius:var(--radius-sm)"><span>surface-tint</span></div>
<div class="sw" style="background:var(--surface-accent);color:#fff;border-radius:var(--radius-sm)"><span>surface-accent</span></div>
<div class="sw" style="background:var(--surface-inverse);color:#fff;border-radius:var(--radius-sm)"><span>surface-inverse</span></div>
</div></body></html>
