# Дев-режим: Vite с hot reload. http://localhost:5173
#
# Прод-сборка (nginx): docker compose -f docker-compose.prod.yml up --build
services:
  web:
    build:
      context: .
      target: dev
    ports:
      # Порт на хосте переопределяется: WEB_PORT=5174 docker compose up
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      # node_modules остаются из образа: в бинарниках линуксовые сборки,
      # хостовая папка их бы перекрыла.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
