server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Относительный Location: за пробросом портов docker абсолютный адрес
    # в редиректе потерял бы порт с хоста.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 1024;

    # Адрес со слешем на конце дублирует страницу, уводим на вариант без него.
    rewrite ^/(.+)/$ /$1 permanent;

    # Каждая страница собрана в свой index.html (scripts/prerender.mjs).
    # index.html проверяется раньше $uri: для корня $uri — каталог, и индексный
    # модуль сделал бы внутренний редирект вместо прямой отдачи файла.
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Несуществующий адрес получает честный код 404 и страницу «Такой страницы нет».
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Бандлы Vite содержат хэш в имени — кэшируем навсегда.
    location ~* ^/assets/index-.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Статика из public/assets (шрифты, иконки, логотипы) имя не меняет,
    # поэтому кэш короче: замена файла разойдётся по клиентам за неделю.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
