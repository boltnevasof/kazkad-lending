server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Лендинг — SPA на одном роуте, но на всякий случай отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Бандлы Vite содержат хэш в имени — кэшируем навсегда.
    location ~* ^/assets/index-.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Статика из public/assets (шрифты, иконки, логотипы) имя не меняет,
    # поэтому кэш короче: замена файла разойдётся по клиентам за неделю.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
